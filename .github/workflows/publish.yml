name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag with locally tested release assets
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable OIDC when no bootstrap token is configured
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${BOOTSTRAP_NPM_TOKEN}" ]]; then
            sed -i '/:_authToken=/d' "${NPM_CONFIG_USERCONFIG}"
          fi
      - name: Use an npm CLI with Trusted Publishing support
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify tag and package version
        run: |
          package_version=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: npm run verify
      - name: Refuse to overwrite an existing version
        run: |
          package_name=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.name)')
          package_version=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists" >&2
            exit 1
          fi
      - name: Publish public package with provenance
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-local-artifacts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download locally tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir dist
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable OIDC when no bootstrap token is configured
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${BOOTSTRAP_NPM_TOKEN}" ]]; then
            sed -i '/:_authToken=/d' "${NPM_CONFIG_USERCONFIG}"
          fi
      - run: npm install --global npm@11.19.0
      - name: Publish locally tested package
        run: npm publish dist/*.tgz --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
