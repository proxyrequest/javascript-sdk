    User:
      type: object
      description: Customer account with contact details, security settings, package
        data, referral information, and managed sub-users visible to the caller.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Value must contain only letters, numbers, and underscores.
            It must not start or end with an underscore.
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        is_reseller:
          type: boolean
          title: Reseller
          description: Reseller can create sub-users and manage their data.
        is_marketer:
          type: boolean
          title: Marketer
          description: Marketer can manage marketing campaigns and view analytics.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        date_joined_ts:
          type: integer
          description: Timestamp of when the user joined
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        balance:
          type: integer
          maximum: 2147483647
          minimum: 0
        language:
          $ref: '#/components/schemas/LanguageEnum'
        country:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
        zip:
          type: string
          maxLength: 255
        company_name:
          type: string
          maxLength: 255
        company_address:
          type: string
          maxLength: 255
        company_city:
          type: string
          maxLength: 255
        company_postal_code:
          type: string
          maxLength: 255
        company_country:
          type: string
          maxLength: 255
        company_vat_number:
          type: string
          maxLength: 255
        allowed_ips:
          type: array
          items:
            type: string
          description: List of IP addresses allowed for this user
          readOnly: true
        blocked_domains:
          type: array
          items:
            type: string
          description: List of domains blocked for this user
          readOnly: true
        connection_limit:
          type: integer
          maximum: 2147483647
          minimum: -1
          description: The maximum number of concurrent connections allowed for this
            package.
        parent_id:
          type: string
          description: ID of the parent user (for sub-accounts)
          readOnly: true
        sub_users:
          type: integer
          description: Number of sub-users managed by this reseller
          readOnly: true
        referrals:
          type: integer
          description: Number of users referred by this user
          readOnly: true
        referral_id:
          type: string
          maxLength: 255
        referral_code:
          type: string
          readOnly: true
        referral_data_earned:
          type: integer
          readOnly: true
        referral_data_pending:
          type: integer
          readOnly: true
        referral_balance_pending:
          type: integer
          readOnly: true
        referral_balance_earned:
          type: integer
          readOnly: true
        currency:
          type: object
          additionalProperties:
            type: string
          description: Currency information for the user's transactions
          readOnly: true
        coupons:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Available coupons for this user
          readOnly: true
        data:
          type: integer
          nullable: true
          description: Available data allowance for the user
          readOnly: true
        data_spent:
          type: integer
          nullable: true
          description: Amount of data consumed by the user
          readOnly: true
        data_updated:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp for user's data
          readOnly: true
        proxy_password:
          type: string
          nullable: true
          description: Proxy authentication password
          readOnly: true
        proxy_password_reset:
          type: string
          format: date-time
          nullable: true
          description: Last proxy password reset timestamp
          readOnly: true
      required:
      - allowed_ips
      - blocked_domains
      - coupons
      - currency
      - data
      - data_spent
      - data_updated
      - date_joined
      - date_joined_ts
      - email
      - id
      - parent_id
      - proxy_password
      - proxy_password_reset
      - referral_balance_earned
      - referral_balance_pending
      - referral_code
      - referral_data_earned
      - referral_data_pending
      - referrals
      - sub_users
      - username
    UserCreateRequest:
      type: object
      description: Fields accepted when a reseller or administrator creates a customer
        account.
      properties:
        email:
          type: string
          format: email
          description: User's email address. Must be unique if provided.
        username:
          type: string
          minLength: 4
          description: Unique username for the account. Must be 4-128 characters.
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: Account password. Must be 8-128 characters long.
          maxLength: 128
        first_name:
          type: string
          description: User's first name.
          maxLength: 128
        last_name:
          type: string
          description: User's last name.
          maxLength: 128
        country:
          type: string
          description: User's country of residence.
          maxLength: 128
        state:
          type: string
          description: User's state or province.
          maxLength: 128
        city:
          type: string
          description: User's city.
          maxLength: 128
        address:
          type: string
          description: User's street address.
          maxLength: 128
        zip:
          type: string
          description: User's postal/ZIP code.
          maxLength: 128
        blocked_domains:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: List of domains to block for this user.
        allowed_ips:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: List of source IP addresses allowed for this user. The maximum
            list size is configured per deployment.
        connection_limit:
          type: integer
          description: Maximum number of concurrent connections allowed for the user.
          minimum: -1
          maximum: 1000000
        is_reseller:
          type: boolean
          default: false
          description: Whether the user should have reseller privileges. Only superusers
            can create resellers.
        is_top_level:
          type: boolean
          default: false
          description: Whether the user is a sub-user under the parent account.
        data:
          type: integer
          minimum: 0
          description: Initial data allocation for the user (traditional auth mode
            only).
        package_id:
          type: string
          format: uuid
          description: ProxyRequest package UUID to assign to the user (package-based
            auth mode only). Headless integrations resolve it from their local product
            mapping.
        meta:
          type: object
          additionalProperties: {}
          description: Additional metadata for the user. Maximum 50 fields.
      required:
      - password
      - username
    UserPasswordResetRequestRequest:
      type: object
      properties:
        package_id:
          type: string
          format: uuid
          description: Package whose proxy password should be rotated. Required only
            when package-based authentication is enabled.
    WebhookCreateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WebhookScopeEnum'
        endpoint:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        read_timeout:
          type: integer
          maximum: 60
          minimum: 1
          default: 5
        write_timeout:
          type: integer
          maximum: 60
          minimum: 1
          default: 5
        retries:
          type: integer
          maximum: 10
          minimum: 0
          default: 3
        retry_timeout:
          type: integer
          maximum: 300
          minimum: 1
          default: 10
      required:
      - endpoint
      - type
    WebhookCreated:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
        type:
          allOf:
          - $ref: '#/components/schemas/WebhookScopeEnum'
          description: Context in which this webhook operates. Determines which events
            are delivered. User events scoped to the associated user account Reseller
            events scoped to the reseller and their sub-accounts System platform-wide
            system events * `user` - User * `reseller` - Reseller * `system` - System
        endpoint:
          type: string
          format: uri
          title: Endpoint URL
          description: HTTPS URL that receives webhook POST requests when events are
            triggered. https://example.com/webhooks/proxy The endpoint must be publicly
            accessible and respond within the configured read timeout.
          maxLength: 500
        secret:
          type: string
          title: Signing Secret
          description: Secret used to sign each webhook payload. The receiving endpoint
            should verify the signature to confirm the request originated from this
            platform. Auto-generated if left blank. Store this value securely on the
            receiving end.
          maxLength: 255
        read_timeout:
          type: integer
          maximum: 60
          minimum: 1
          title: Read Timeout (seconds)
          description: Maximum time to wait for the endpoint to return a response.
            Requests that exceed this limit are treated as failed and may be retried.
        write_timeout:
          type: integer
          maximum: 60
          minimum: 1
          title: Write Timeout (seconds)
          description: Maximum time to wait while sending the payload to the endpoint.
            Requests that exceed this limit are treated as failed and may be retried.
        retries:
          type: integer
          maximum: 10
          minimum: 0
          description: Number of additional delivery attempts after an initial failure.
            Set to 0 to disable retries. 3 → up to 4 total delivery attempts
        retry_timeout:
          type: integer
          maximum: 300
          minimum: 1
          title: Retry Interval (seconds)
          description: How long to wait before each retry attempt after a failed delivery.
            10 → retry after 10 seconds
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - endpoint
    WebhookList:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
        type:
          allOf:
          - $ref: '#/components/schemas/WebhookScopeEnum'
          description: Context in which this webhook operates. Determines which events
            are delivered. User events scoped to the associated user account Reseller
            events scoped to the reseller and their sub-accounts System platform-wide
            system events * `user` - User * `reseller` - Reseller * `system` - System
        endpoint:
          type: string
          format: uri
          title: Endpoint URL
          description: HTTPS URL that receives webhook POST requests when events are
            triggered. https://example.com/webhooks/proxy The endpoint must be publicly
            accessible and respond within the configured read timeout.
          maxLength: 500
        read_timeout:
          type: integer
          maximum: 60
          minimum: 1
          title: Read Timeout (seconds)
          description: Maximum time to wait for the endpoint to return a response.
            Requests that exceed this limit are treated as failed and may be retried.
        write_timeout:
          type: integer
          maximum: 60
          minimum: 1
          title: Write Timeout (seconds)
          description: Maximum time to wait while sending the payload to the endpoint.
            Requests that exceed this limit are treated as failed and may be retried.
        retries:
          type: integer
          maximum: 10
          minimum: 0
          description: Number of additional delivery attempts after an initial failure.
            Set to 0 to disable retries. 3 → up to 4 total delivery attempts
        retry_timeout:
          type: integer
          maximum: 300
          minimum: 1
          title: Retry Interval (seconds)
          description: How long to wait before each retry attempt after a failed delivery.
            10 → retry after 10 seconds
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - endpoint
    WebhookScopeEnum:
      enum:
      - user
      - reseller
      - system
      type: string
      description: '* `user` - User * `reseller` - Reseller * `system` - System'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Send `Authorization: Bearer YOUR_JWT`. API keys are also accepted
        with the Bearer prefix for compatibility with server integrations.'
    StaticAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Send `Authorization: Static YOUR_API_KEY`.'
  headers:
    ContentLanguage:
      description: Language used for human-readable errors.
      schema:
        type: string
servers:
- url: https://{host}/api/v1
  description: API endpoint for the selected deployment.
  variables:
    host:
      default: api.proxyrequest.com
      description: API hostname assigned to the deployment.
tags:
- name: Authorization
  description: Sign in, create accounts, recover access, and refresh access tokens.
- name: Users
  description: Manage users and sub-users that belong to the current account.
- name: Profile
  description: Read and update the authenticated account and its security settings.
- name: Orders
  description: Review purchased packages, allocated data, and proxy credentials.
- name: Proxies
  description: Generate ready-to-use proxy credentials for an active order.
- name: Analytics
  description: Inspect proxy traffic, connections, domains, errors, and data transactions.
- name: Invoices
  description: Create purchases and inspect invoices, payment links, and receipts.
- name: Coupons
  description: Create, validate, redeem, and inspect discount coupons.
- name: Rewards
  description: Inspect and claim account rewards.
- name: Affiliates
  description: Inspect referred accounts and affiliate earnings.
- name: Packages
  description: Browse available proxy products, pricing, and targeting capabilities.
- name: Locations
  description: Browse locations, networks, and providers available for proxy targeting.
- name: API Keys
  description: Create and revoke API keys for server-to-server integrations.
- name: Webhooks
  description: Configure customer webhook destinations and delivery behaviour.
- name: Telegram dashboard
  description: Connect and configure the Telegram client dashboard.
- name: Telegram dashboard service
  description: Trusted bot-to-API account linking and short-lived sessions.
- name: Sessions
  description: Inspect and revoke active sticky proxy sessions.
- name: Settings
  description: Read gateway addresses, usage totals, and account-wide configuration.
- name: News
  description: Read product and service announcements.
