        is_country_targeting:
          type: boolean
          title: Country Targeting
          description: Allow users to target a specific country in their proxy username.
            country-us country-de
        is_region_targeting:
          type: boolean
          title: Region Targeting
          description: Allow users to target a specific region in their proxy username.
            Requires country targeting to be enabled. country-us-region-california
        is_city_targeting:
          type: boolean
          title: City Targeting
          description: Allow users to target a specific city in their proxy username.
            Requires country and region targeting to be enabled. country-us-region-california-city-los_angeles
        is_asn_targeting:
          type: boolean
          title: ASN Targeting
          description: Allow users to target a specific ASN in their proxy username.
