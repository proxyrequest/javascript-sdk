          content:
            application/json:
              schema:
                type: object
                description: Validation and API error payload. Field names may be
                  added dynamically; field errors are returned as arrays of human-readable
                  messages.
                properties:
                  detail:
                    type: string
                  non_field_errors:
                    type: array
                    items:
                      type: string
                additionalProperties:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              examples:
                AuthenticationRequired:
                  value:
                    detail: Authentication credentials were not provided.
                  summary: Authentication required
          description: Authentication credentials are missing, expired, or invalid.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '403':
