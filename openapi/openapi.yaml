info:
  title: Proxy Public API
  version: 1.0.0
  description: Reference for the customer-facing HTTP API. Request and response examples
    use synthetic values but follow the payloads returned by the service. Authenticate
    customer requests with a JWT or API key in the Authorization header.
paths:
