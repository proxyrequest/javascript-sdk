  /analytics/{id}/transactions:
    get:
      operationId: analytics_transactions_retrieve
      description: Returns data allocation and consumption transactions visible to
        the caller. Sender and recipient filters are restricted to the caller's scope.
      summary: List data transactions
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive end of the reporting window.
        examples:
          EndTime:
            value: '2026-07-02T00:00:00Z'
            summary: End time
      - in: path
        name: id
        schema:
          type: string
        description: Route identifier for this analytics action. Use query parameters
          to filter transactions.
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum records returned on this page.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based number of matching records to skip.
      - in: query
        name: recipient_id
        schema:
          type: string
          format: uuid
        description: Restrict transactions to this recipient account.
      - in: query
        name: sender_id
        schema:
          type: string
          format: uuid
        description: Restrict transactions to this sender account.
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive start of the reporting window. Defaults to a recent
          window.
        examples:
          StartTime:
            value: '2026-07-01T00:00:00Z'
            summary: Start time
      - in: query
        name: timezone
        schema:
          type: string
        description: IANA timezone used for bucket boundaries. Defaults to UTC.
        examples:
          UTC:
            value: UTC
      - in: query
        name: type
        schema:
          type: integer
        description: Transaction type identifier. Defaults to data transactions.
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          default: en
        description: 'Preferred language for human-readable API errors. Supported
          languages: en, ru, uk, de, it, fr, es, zh-hans, ja. Regional language tags
          and quality weights are accepted; unsupported or omitted values use English.'
        examples:
          German:
            value: de
          Weighted:
            value: fr-CA, fr;q=0.9, en;q=0.5
      tags:
      - Analytics
      security:
      - BearerAuth: []
      - StaticAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
